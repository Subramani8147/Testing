name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Installer
        run: npm run dist

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: IT-Operations-Knowledge-Portal
          path: |
            dist/**/*.exe
            release/**/*.exe
